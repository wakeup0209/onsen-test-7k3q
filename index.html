<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; media-src data: blob:; font-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c7ebfd">
<title>溫湯小老闆</title>
<style>
/* ===== 溫湯小老闆：圓角休閒風介面（場景維持像素風）===== */
:root{--bg:#cfeaf5;--panel:#fbf7ee;--panel2:#f1ebdc;--line:#d9cfbb;--ink:#47505a;--ink2:#8b9098;--teal:#5f96a1;--teal-d:#4a7b85;--teal-l:#8fbcc4;
  --slate:#6b87a6;--orange:#f3a03a;--orange-d:#de7f1c;--track:#4d545e;--coral:#de7a63;--coral-d:#bf5d48;--green:#6fae7a;--red:#de5a4a;
  --r:22px;--shadow:0 6px 18px rgba(40,50,60,.18),0 2px 4px rgba(40,50,60,.10);
  --font:"Arial Rounded MT Bold","SF Pro Rounded","Hiragino Maru Gothic ProN","Yuanti TC","圓體-繁","jf open 粉圓","PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
canvas,.ic,.tc,.avatar,.sav img,.mg-lie,.mg-owner{image-rendering:pixelated;image-rendering:crisp-edges}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:20px}
.screen{display:none;position:absolute;inset:0}
.screen.on{display:flex}
button{font-family:var(--font);color:inherit;cursor:pointer}
h2,h3,h4{font-weight:800;color:var(--ink)}
.ic{width:24px;height:24px;object-fit:contain;vertical-align:middle}
.ic.big{width:36px;height:36px}
/* --- 面板／虛線分隔／標籤 --- */
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.dots{height:0;border-top:3px dotted var(--line);margin:10px 0}
.dots.thin{border-top-width:2px;margin:6px 0}
.lvpill{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--ink2);color:var(--ink);border-radius:999px;padding:0 9px;height:22px;font-size:12.5px;font-weight:800;background:#fff;white-space:nowrap;flex:none}
.tag{background:var(--teal-l);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:4px}
/* --- 橘色進度條（深色圓角軌道，可標示 MAX）--- */
.obar{position:relative;display:inline-block;flex:1;min-width:60px;height:14px;border-radius:999px;background:var(--track);overflow:hidden;vertical-align:middle;box-shadow:inset 0 2px 2px rgba(0,0,0,.25)}
.obar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(#ffc066,var(--orange) 55%,var(--orange-d));width:0;transition:width .25s}
.obar em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10.5px;font-weight:800;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5);letter-spacing:.5px}
.obar.bad i{background:linear-gradient(#ff9a86,var(--red))}
.obar.xp{min-width:90px;height:13px}
/* --- 藥丸按鈕（霧藍綠，白字）--- */
.pbtn{border:0;background:var(--teal);color:#fff;font-weight:800;font-size:15.5px;padding:10px 18px;min-height:44px;border-radius:999px;box-shadow:0 3px 0 var(--teal-d),0 5px 10px rgba(40,60,70,.18);
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;transition:transform .06s}
.pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal-d)}
.pbtn small{font-size:11.5px;font-weight:600;opacity:.92}
.pbtn.big{font-size:18px;padding:12px 26px;min-height:52px}
.pbtn.small{font-size:13.5px;padding:6px 14px;min-height:36px}
.pbtn.go{background:var(--slate);box-shadow:0 3px 0 #536c88,0 5px 12px rgba(40,60,90,.22)}
.pbtn.ghost{background:#fff;color:var(--teal-d);box-shadow:inset 0 0 0 2px var(--teal-l),0 3px 0 #d7e6e8}
.pbtn.warn{background:var(--coral);box-shadow:0 3px 0 var(--coral-d)}
.pbtn.cost{min-width:86px;padding:6px 14px;min-height:50px;flex:none}
.pbtn.cost .cv{display:flex;align-items:center;gap:3px;font-size:14.5px;font-variant-numeric:tabular-nums}
.pbtn.cost .cv .ic{width:17px;height:17px}
.pbtn.cost .cl{font-size:12px;font-weight:700;opacity:.95;border-top:1.5px solid rgba(255,255,255,.4);padding-top:1px;margin-top:2px;min-width:3.5em;text-align:center}
.pbtn.dis{background:#a9b5b9;box-shadow:0 3px 0 #8d999d}
/* --- 圓形圖示按鈕：關閉 X、說明 ?、加號 + --- */
.rbtn{flex:none;border:0;width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;font-weight:900;font-size:19px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--teal-d),0 3px 6px rgba(0,0,0,.15);padding:0;line-height:1}
.rbtn:active{transform:translateY(1px)}
.rbtn.q{background:#fff;color:var(--teal-d);box-shadow:inset 0 0 0 2.5px var(--teal),0 2px 4px rgba(0,0,0,.1)}
.rbtn.x i{position:relative;width:14px;height:14px}
.rbtn.x i::before,.rbtn.x i::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:3px;border-radius:2px;background:#fff;transform:translate(-50%,-50%) rotate(45deg)}
.rbtn.x i::after{transform:translate(-50%,-50%) rotate(-45deg)}
.rbtn.plus{width:26px;height:26px;font-size:19px;margin-left:2px}
/* --- 視窗標題列 --- */
.mhead{display:flex;align-items:center;gap:8px}
.mhead h2{margin:0;font-size:19px;display:flex;flex-direction:column;line-height:1.15}
.mhead h2 small{font-size:12px;font-weight:600;color:var(--ink2)}
.mhead .sp{flex:1}
.mhead .lvpill{margin-right:auto}
.fic{flex:none;width:42px;height:42px;border-radius:14px;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px var(--line)}
.fic .ic{width:30px;height:30px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.phead h3,.phead h4{margin:0}
/* --- 膠囊（HUD 與資金顯示）--- */
.cap{display:inline-flex;align-items:center;gap:5px;background:rgba(251,247,238,.94);border-radius:999px;padding:3px 4px 3px 7px;min-height:34px;box-shadow:var(--shadow);font-weight:800;color:var(--ink);white-space:nowrap}
.cap b{font-variant-numeric:tabular-nums;font-size:15px;min-width:1.4em;padding-right:6px}
.cap .ic{width:20px;height:20px}
.money-cap.inmodal{box-shadow:inset 0 0 0 2px var(--line);margin:8px 0 0;padding-right:12px}
.money-cap small{font-weight:600;color:var(--ink2);font-size:11.5px}
.neg{color:var(--red)!important}
/* ---------- 標題 ---------- */
#scr-title{align-items:center;justify-content:center;overflow:hidden}
.title-bg,.setup-bg{position:absolute;inset:-12px;background-size:cover;background-position:center;filter:brightness(.97) saturate(1.05) blur(1px)}
.title-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;max-width:460px;width:100%}
.logo{text-align:center}
.logo h1{margin:4px 0 0;font-size:clamp(42px,12vw,62px);color:#fff;letter-spacing:4px;font-weight:900;
  text-shadow:0 3px 0 var(--teal-d),0 6px 0 #3c6870,0 10px 18px rgba(0,0,0,.35);-webkit-text-stroke:2px var(--teal-d)}
.logo-sub{display:inline-block;background:var(--orange);color:#fff;padding:3px 14px;font-size:14px;font-weight:800;border-radius:999px;box-shadow:0 2px 0 var(--orange-d)}
.title-chars{display:flex;align-items:flex-end;gap:6px;height:140px}
.tc{height:104px;width:auto;animation:bob 1.2s steps(2) infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.tc0{height:130px;animation-delay:.3s}.tc2{animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-4px)}}
.title-card{width:min(360px,94%);display:flex;flex-direction:column}
.namebox{display:flex;align-items:center;gap:10px;font-weight:800}
.namebox input{flex:1;min-width:0;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:999px;background:#fff;padding:7px 14px;color:var(--ink);outline:none}
.namebox input:focus{border-color:var(--teal)}
.title-btns{display:flex;flex-direction:column;gap:10px}
.title-btns .row2{display:flex;gap:10px}.title-btns .row2 .pbtn{flex:1}
.credit{color:#fff;font-size:12px;margin:2px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
/* ---------- 開店準備 ---------- */
#scr-setup{flex-direction:column;overflow:hidden}
.setup-top{position:relative;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px 6px;flex-wrap:wrap}
.cap.who{padding:4px 14px 4px 4px;border-radius:24px;gap:8px}
.cap.who b{font-size:15px}
.who-sub{display:flex;align-items:center;gap:6px;margin-top:2px}
.avatar{height:44px;width:44px;object-fit:cover;object-position:top;border-radius:50%;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--line)}
.setup-body{position:relative;flex:1;overflow-y:auto;padding:4px 12px 14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.setup-body .panel{max-width:760px;width:100%;margin:0 auto}
.setup-body h3{font-size:18px;margin:0}
.setup-body h4{margin:4px 0 8px;font-size:15.5px}
.setup-body h4 small,.fs-t small{font-weight:600;font-size:11.5px;color:var(--ink2);margin-left:4px}
.staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border:0;border-radius:18px;padding:10px 8px;text-align:center;box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px}
.card.on{box-shadow:inset 0 0 0 3px var(--teal);background:#eef6f6}
.sav{width:58px;height:58px;border-radius:50%;background:var(--panel2);display:flex;align-items:flex-start;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.sav img{height:78px;width:auto;margin-top:3px}
.card.on .sav{box-shadow:inset 0 0 0 3px var(--teal)}
.c-name{font-weight:800;font-size:15px}
.c-desc{font-size:11.5px;color:var(--ink2);min-height:3em;line-height:1.35}
.c-flag{margin-top:4px;background:var(--teal);color:#fff;padding:4px 14px;font-size:13px;font-weight:800;border-radius:999px;display:flex;flex-direction:column;line-height:1.15;box-shadow:0 2px 0 var(--teal-d)}
.c-flag small{font-size:10.5px;font-weight:600;opacity:.92}
.card.on .c-flag{background:var(--slate);box-shadow:0 2px 0 #536c88}
.fac-list{display:flex;flex-direction:column}
.fac-row{display:flex;align-items:center;gap:10px;cursor:pointer;padding:2px 0}
.fr-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.fr-n{font-weight:800;display:flex;align-items:center;gap:6px}
.fr-v{font-size:12px;color:var(--ink2);font-weight:600}
.fr-m .obar{flex:none;width:100%;height:10px}
.go-ar{font-size:26px;color:var(--teal);font-weight:900;padding:0 4px}
.water-row{display:flex;flex-wrap:wrap;gap:7px}
.wbtn{border:0;background:#fff;border-radius:16px;box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 4px;min-width:62px;min-height:58px;font-size:12px;font-weight:700;position:relative}
.wbtn .ic{width:26px;height:26px}
.wbtn.on{box-shadow:inset 0 0 0 3px var(--teal);background:#eef6f6;color:var(--teal-d)}
.wbtn.locked{opacity:.5;filter:grayscale(.8)}
.wbtn em{position:absolute;top:-7px;right:-5px;background:var(--ink);color:#fff;font-style:normal;font-size:10px;padding:1px 6px;border-radius:999px}
.water-info{margin:8px 0 2px;font-size:13px;background:var(--panel2);padding:8px 12px;border-radius:14px;line-height:1.5}
.water-info small{color:var(--ink2)}
.stock-row,.stockbar{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;align-items:center;margin-top:8px}
.stk{display:inline-flex;align-items:center;gap:3px;font-weight:800;background:#fff;border-radius:999px;padding:2px 10px 2px 4px;box-shadow:inset 0 0 0 2px var(--line)}
.stk .ic{width:20px;height:20px}
.stk.low{color:var(--red);box-shadow:inset 0 0 0 2px #f0b0a6}
.setup-foot{position:relative;background:var(--panel);border-radius:var(--r) var(--r) 0 0;box-shadow:0 -4px 16px rgba(40,50,60,.16);padding:10px 14px calc(10px + env(safe-area-inset-bottom));font-size:12.5px;color:var(--ink2)}
.setup-foot b{color:var(--ink)}
.row-btns{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:10px}
.col-btns{display:flex;flex-direction:column;gap:10px}
/* ---------- 設施升級區塊 ---------- */
.fac-up{display:flex;align-items:center;gap:12px}
.fu-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.fu-val{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.fu-val b{font-size:22px;font-variant-numeric:tabular-nums}
.fu-val small{font-size:12px;color:var(--ink2);font-weight:600}
.fu-val .arrow{font-size:13px;font-weight:800;color:var(--teal-d);background:#e7f1f2;border-radius:999px;padding:1px 8px}
.fu-bar{display:flex;align-items:center;gap:8px}
.fu-next{font-size:12px;color:var(--ink2);font-weight:600}
.fac-staff .fs-t{font-weight:800;font-size:14px;margin-bottom:6px}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slot{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0;min-width:70px;font-size:12px;font-weight:800}
.slot .sav{width:52px;height:52px;border:2.5px dashed var(--teal-l);box-shadow:none;align-items:center}
.slot.on .sav{border:3px solid var(--teal);align-items:flex-start}
.slot .sav i{font-style:normal;font-size:26px;color:var(--teal);font-weight:900}
.slot .sw{font-size:10.5px;color:var(--ink2);font-weight:600}
.slot:disabled{cursor:default;opacity:1}
/* ---------- 遊戲畫面：場景全螢幕，介面浮在上面 ---------- */
#scr-game{background:#c7ebfd;overflow:hidden}
#scene{position:absolute;left:0;top:0;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px 4px;z-index:5;pointer-events:none;flex-wrap:wrap}
#hud button{pointer-events:auto}
.clockcap{padding:3px 10px 3px 4px;position:relative;gap:6px}
.clock{font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;min-width:3em}
.obar.day{flex:none;width:44px;height:9px;min-width:0}
@media (max-width:420px){#hud{gap:4px;padding-left:6px;padding-right:6px}.cap{min-height:32px;padding-left:5px;gap:3px}.cap b{font-size:13.5px;padding-right:4px}.cap .ic{width:18px;height:18px}.clockcap .lvpill{padding:0 6px;font-size:11.5px;height:20px}.clock{font-size:14px}.obar.day{width:30px}.rbtn.plus{width:24px;height:24px;font-size:17px}}
#toast{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(71,80,90,.94);color:#fff;padding:8px 16px;font-size:14px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center;border-radius:999px;box-shadow:var(--shadow);z-index:8}
#toast.on{opacity:1}
/* 右側圓形按鈕列 */
#fabs{position:absolute;right:calc(8px + env(safe-area-inset-right));top:calc(56px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;z-index:6}
.sbtn{position:relative;border:0;width:50px;height:50px;border-radius:50%;background:rgba(251,247,238,.95);box-shadow:var(--shadow),inset 0 -3px 0 rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.sbtn .ic{width:24px;height:24px}
.sbtn small{font-size:9.5px;font-weight:800;line-height:1;margin-top:1px}
.sbtn b{font-size:20px;line-height:1;color:var(--teal-d)}
.sbtn .pz{width:14px;height:16px;border-left:5px solid var(--teal-d);border-right:5px solid var(--teal-d);margin-bottom:2px}
.sbtn:active{transform:scale(.94)}
.sbtn em{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-style:normal;font-size:11.5px;font-weight:800;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:999px;box-shadow:0 0 0 2px #fff}
body.sheet-on #fabs{opacity:.0;pointer-events:none}
@media (min-height:700px){body.sheet-on #fabs{opacity:1;pointer-events:auto}}
/* 底部面板（點水池／設施） */
#sheet{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:7;transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .2s,visibility .2s;padding:12px 14px 14px;background:var(--panel);border-radius:var(--r);box-shadow:0 10px 30px rgba(20,30,40,.35);max-height:62vh;overflow-y:auto}
#sheet.on{transform:none;visibility:visible}
#sheet .dots{margin:8px 0}
@media (min-width:700px){#sheet{left:50%;right:auto;width:460px;margin-left:-230px;bottom:16px}}
.prow{display:grid;grid-template-columns:1fr 70px 70px;gap:8px;align-items:center}
.p-gauges{display:flex;flex-direction:column;gap:6px}
.p-hint{font-size:12px;font-weight:800;color:var(--teal-d)}
.prow.warn .p-hint{color:var(--red)}
.g{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.gl{width:2.4em;color:var(--ink2)}
.gbar{position:relative;flex:1;height:12px;background:var(--track);border-radius:999px;overflow:hidden}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:var(--orange);width:0;border-radius:999px}
.gbar.dirt i{background:linear-gradient(#c9a070,#9a7040)}
.gbar i.bad{background:var(--red)!important}
.gbar.temp u{position:absolute;left:25%;width:50%;top:0;bottom:0;background:rgba(140,220,160,.28);border-left:2px solid #9be0a8;border-right:2px solid #9be0a8}
.gbar.temp.cold u{left:0;width:40%;border-left:0}
.gbar.dirt u{position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #ff9a86}
.gbar.temp i{background:linear-gradient(90deg,#78b9de,var(--orange))}
.gv{width:3.2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.vbtn{border:0;border-radius:20px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;gap:1px;padding:4px}
.vbtn .ic{width:28px;height:28px}
.vbtn small{font-size:10px;font-weight:600;opacity:.9}
.vbtn.hot{background:var(--coral);box-shadow:0 3px 0 var(--coral-d)}
.vbtn.cold{background:var(--teal);box-shadow:0 3px 0 var(--teal-d)}
.vbtn:active,.bbtn:active{transform:translateY(2px)}
/* 紀錄抽屜 */
#drawer{visibility:hidden;position:absolute;top:calc(8px + env(safe-area-inset-top));right:8px;bottom:calc(8px + env(safe-area-inset-bottom));width:min(360px,calc(100vw - 16px));z-index:9;background:var(--panel);border-radius:var(--r);box-shadow:0 10px 30px rgba(20,30,40,.35);transform:translateX(calc(100% + 30px));transition:transform .2s,visibility .2s;display:flex;flex-direction:column;padding:12px 14px}
#drawer.on{transform:none;visibility:visible}
#drawer .dots{margin:8px 0 4px}
.dr-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.dr-body h4{margin:8px 0 2px;font-size:14px}
.drp{background:#fff;padding:9px 12px;border-radius:14px;box-shadow:inset 0 0 0 2px var(--line);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.drp .go-ar{font-size:20px;padding:0}
.drp.bad{color:var(--red);box-shadow:inset 0 0 0 2px #f0b0a6}
.p-sub{font-size:11px;color:var(--ink2)}
.bbtn{border:0;width:100%;background:#fff;border-radius:14px;box-shadow:inset 0 0 0 2px var(--line);min-height:50px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;align-items:center;gap:3px 8px;padding:6px 12px;font-weight:700;font-size:13px;text-align:left;margin-bottom:4px}
.bbtn .ic{grid-row:1/3}
.bbtn .obar{height:10px}
.bbtn.warn{box-shadow:inset 0 0 0 2px var(--red);background:#fff3f0}
.staffbar{display:flex;flex-wrap:wrap;gap:5px;font-size:12px}
.staffbar span{background:var(--panel2);padding:3px 10px;border-radius:999px;font-weight:700}.staffbar span.on{background:var(--teal);color:#fff}
.daylog{font-size:12px;background:var(--panel2);padding:8px 12px;border-radius:14px;line-height:1.6}
/* ---------- 視窗 ---------- */
#modal{display:none;position:fixed;inset:0;background:rgba(40,50,60,.5);z-index:50;align-items:center;justify-content:center;padding:14px}
#modal.on{display:flex}
#modal-box{background:var(--panel);max-width:500px;width:100%;max-height:100%;overflow-y:auto;padding:16px 18px;border-radius:26px;box-shadow:0 14px 40px rgba(20,30,40,.4)}
#modal-box p{line-height:1.55}
.help p{font-size:14px;line-height:1.6;margin:8px 0}
.help .ic{width:20px;height:20px}
.shop{display:flex;flex-direction:column}
.shop-row{display:flex;align-items:center;gap:10px}
.sr-name{flex:1;font-weight:800;display:flex;flex-direction:column;gap:1px}
.sr-name small{font-weight:600;font-size:11.5px;color:var(--ink2)}
.sr-stock{font-size:12px;font-weight:800;color:var(--teal-d)}.sr-stock.low{color:var(--red)}
.money{color:var(--orange-d)}
.h-sub{font-size:12.5px;color:var(--ink2)}
.rt{width:100%;border-collapse:collapse;font-size:13.5px}
.rt td{padding:5px 4px;border-bottom:2px dotted var(--line)}
.rt td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.rt td:nth-child(2){color:var(--ink2);font-size:12px}
.rt .sec td{border:0;padding-top:10px;text-align:left}
.rt .sec td::before{content:"";display:inline-block}
.rt .sec td{font-weight:900;color:var(--teal-d);font-size:14px}
.rt .tot td{border-bottom:0;font-weight:900;background:var(--panel2)}
.rt .tot td:first-child{border-radius:12px 0 0 12px}.rt .tot td:last-child{border-radius:0 12px 12px 0}
.rt .ic{width:18px;height:18px}
.net{font-size:20px;text-align:center;margin:12px 0 6px;font-weight:900;background:#fff;border-radius:999px;padding:8px;box-shadow:inset 0 0 0 2px var(--line)}
.net.pos b{color:#3f9a5a}.net.neg b{color:var(--red)}
.res-xp{font-size:13px;margin:6px 0;color:var(--ink2);font-weight:600}
.res-xp b{color:var(--ink)}
.res-lv{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res-lv .obar{min-width:110px}
.res-lv .money-cap.inmodal{margin:0}
.lvup{margin:10px 0;text-align:center;background:#fff3df;padding:10px;font-weight:900;color:var(--orange-d);font-size:17px;border-radius:18px;box-shadow:inset 0 0 0 2px #f6c886}
.lvup small{color:var(--ink);font-weight:700}
/* ---------- 搓澡小遊戲 ---------- */
#modal.scrubm #modal-box{max-width:430px}
.mg-top{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.mg-combo{color:#fff;background:var(--orange);border-radius:999px;padding:2px 12px;font-weight:900;font-size:16px;box-shadow:0 2px 0 var(--orange-d)}
.mg-timer{height:14px;background:var(--track);border-radius:999px;overflow:hidden;margin:8px 0 12px}
.mg-timer i{display:block;height:100%;width:100%;border-radius:999px;background:linear-gradient(#ffc066,var(--orange) 55%,var(--orange-d))}
.mg-board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:4px;aspect-ratio:1;width:min(100%,340px);margin:0 auto;position:relative}
.mg-board.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mg-cell{background:var(--panel2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(12px,4.5vw,20px);color:var(--ink2)}
.mg-cell.use{background:#fff;box-shadow:inset 0 0 0 2px var(--line);color:var(--teal-d)}
.mg-cell.k5{color:#fff;background:var(--coral);font-size:clamp(11px,3.6vw,16px)}
.mg-cell.cur{background:var(--orange);color:#fff;box-shadow:0 0 0 3px #fff,0 3px 8px rgba(0,0,0,.3);transform:scale(1.14);z-index:2;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.04)}}
.mg-cell.ok{background:var(--teal-l);color:#fff;box-shadow:none;animation:none;transform:none}
.mg-center{grid-column:2/8;grid-row:2/8;position:relative;display:flex;align-items:center;justify-content:center;background:#e9dcc4;border-radius:18px;overflow:hidden}
.mg-lie{width:66%;height:auto;position:absolute;right:4%;top:38%}
.mg-lie.rub{animation:rub .15s steps(2)}
@keyframes rub{50%{transform:translateX(3px) scaleY(.96)}}
.mg-owner{height:56%;width:auto;position:absolute;left:4%;top:6%}
.mg-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5),0 0 2px var(--teal-d);pointer-events:none;text-align:center}
.mg-res{background:var(--panel);color:var(--ink);padding:12px 16px;font-size:15px;line-height:1.55;pointer-events:auto;text-shadow:none;border-radius:20px;box-shadow:var(--shadow)}
.mg-res.bad{color:var(--red)}
.mg-pad{display:grid;grid-template-areas:". u . s" "l d r s";grid-template-columns:repeat(3,62px) 1fr;gap:8px;margin-top:14px;justify-content:center}
.kbtn{border:0;height:56px;font-size:20px;font-weight:900;background:var(--teal);color:#fff;border-radius:18px;box-shadow:0 3px 0 var(--teal-d)}
.kbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal-d)}
.kbtn.rub{background:var(--coral);box-shadow:0 3px 0 var(--coral-d);font-size:24px;height:auto;border-radius:24px}
@media (max-height:560px){.title-chars{height:80px}.tc{height:70px}.tc0{height:82px}}
#modal.resm .row-btns,#modal.facm .row-btns{position:sticky;bottom:-16px;background:linear-gradient(rgba(251,247,238,0),var(--panel) 30%);padding:14px 0 8px;margin-bottom:-8px}

</style>
</head>
<body>
<div id="app">
  <div id="loading">載入中…</div>
  <section id="scr-title" class="screen"></section>
  <section id="scr-setup" class="screen"></section>
  <section id="scr-game" class="screen">
    <canvas id="scene" width="384" height="288"></canvas>
    <header id="hud"></header>
    <div id="toast"></div>
    <div id="fabs"></div>
    <div id="sheet"></div>
    <aside id="drawer"></aside>
  </section>
  <div id="modal"><div id="modal-box"></div></div>
</div>

const AU = { ctx: null, last: {} };

function tone(f, dur, type, vol, when, slide) {
  const a = AU.ctx, t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();

  g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}

  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();

function nearestNode(x, y) {

function sizeSheet() { const sh = $('#sheet'); document.documentElement.style.setProperty('--sheetH', sh.offsetHeight + 'px'); }

function poolRowUpdate(r, z) {
  const d = G.day, p = d.pools[z], isC = z === 'C';
  const tC = isC ? 10 + p.temp : 30 + p.temp, ok = poolOk(z);
  const ti = r.querySelector('.temp i'); ti.style.width = (p.temp / 20 * 100) + '%'; ti.className = (isC ? p.temp > 8 : (p.temp > 15 || p.temp < 5)) ? 'bad' : '';
  const di = r.querySelector('.dirt i'); di.style.width = (p.dirt / 20 * 100) + '%'; di.className = p.dirt > 10 ? 'bad' : '';
  r.querySelector('.gv.t').textContent = Math.round(tC) + '°C';
  r.querySelector('.gv.d').textContent = Math.round(p.dirt / 20 * 100) + '%';

<script>
'use strict';
// ===== 搓澡小遊戲：依序按出方向（↑→↓←）與「搓！」=====
const ARW = { 1: '▲', 2: '▶', 3: '▼', 4: '◀', 5: '搓' };
const MG = { on: false };
function ringPos(i) { // 28 格：上排→右列→下排→左列（8×8 外框）
  if (i < 7) return [i, 0]; if (i < 14) return [7, i - 7]; if (i < 21) return [7 - (i - 14), 7]; return [0, 7 - (i - 21)];
}
function openScrubGame(c) {
  const n = 14 + rnd(14), start = rnd(28), way = rnd(2) ? 1 : -1, center = Math.floor(n / 2);
  const seq = []; for (let i = 0; i < n; i++) seq.push(i === center ? 5 : 1 + rnd(4));
  // 依前進方向排定每一步對應的格子
  const cells = seq.map((_, i) => ((start + way * i) % 28 + 28) % 28);   // 沿外框順／逆時針前進
  const order = seq.map((_, i) => i);
  Object.assign(MG, { on: true, c, seq, cells, order, step: 0, combo: 0, maxCombo: 0, total: 9 + n * 0.12, left: 0, started: false, done: false, ok: false });
  MG.left = MG.total;
  const lie = rotate90(GFX.custL[c.type + CUST_TYPES.length]).toDataURL();
  const b = modal(`<div class="mg">
    <div class="mg-top"><b>搓澡時間！</b><span class="mg-combo" id="mg-combo">0 連擊</span></div>
    <div class="mg-timer"><i id="mg-time"></i></div>
    <div class="mg-board" id="mg-board">
      ${Array.from({ length: 28 }, (_, i) => { const [x, y] = ringPos(i); return `<div class="mg-cell" id="mgc${i}" style="grid-column:${x + 1};grid-row:${y + 1}"></div>`; }).join('')}
      <div class="mg-center"><img src="${lie}" class="mg-lie" id="mg-lie"><img src="${URLS.staff_owner}" class="mg-owner" id="mg-owner"><div class="mg-msg" id="mg-msg">準備…</div></div>
    </div>
    <div class="mg-pad">
      <button class="kbtn" data-k="4" style="grid-area:l">◀</button><button class="kbtn" data-k="1" style="grid-area:u">▲</button>
      <button class="kbtn" data-k="3" style="grid-area:d">▼</button><button class="kbtn" data-k="2" style="grid-area:r">▶</button>
      <button class="kbtn rub" data-k="5" style="grid-area:s">搓！</button>
    </div></div>`, 'scrubm');
  seq.forEach((v, i) => { const cell = $('#mgc' + cells[i], b); cell.textContent = ARW[v]; cell.classList.add('use', v === 5 ? 'k5' : 'k'); });
  $$('.kbtn', b).forEach(k => k.addEventListener('pointerdown', e => { e.preventDefault(); audioUnlock(); mgPress(+k.dataset.k); }));
  mgMark();
  setTimeout(() => { if (MG.on) { MG.started = true; $('#mg-msg').textContent = '開始！'; setTimeout(() => { const m = $('#mg-msg'); if (m && MG.on && !MG.done) m.textContent = ''; }, 600); } }, 900);
}
function mgMark() { $$('.mg-cell').forEach(e => e.classList.remove('cur')); if (MG.step < MG.seq.length) { const i = MG.order[MG.step]; $('#mgc' + MG.cells[i]).classList.add('cur'); } }
function mgPress(k) {
  if (!MG.on) return;
  if (MG.done) { if (k === 5 || k === 0) mgClose(); return; }
  if (!MG.started) return;
  const i = MG.order[MG.step], want = MG.seq[i];

    const lie = $('#mg-lie'); lie.classList.remove('rub'); void lie.offsetWidth; lie.classList.add('rub');
    if (k === 5) { $('#mg-msg').textContent = '用力搓！'; setTimeout(() => { if (MG.on && !MG.done) $('#mg-msg').textContent = ''; }, 500); }

  }

}
function mgTick(dt) {

function mgFinish(ok) {

    : `<div class="mg-res bad">時間到…搓澡失敗<br>最大連擊 ${MG.maxCombo}<br>滿意度 -1<br><button class="pbtn small" id="mg-ok">完成</button></div>`;
  $('#mg-ok').onclick = () => { btn(); mgClose(); };

}
function mgClose() { if (!MG.on) return; MG.on = false; closeModal(); endScrub(MG.c, MG.ok, MG.maxCombo); }
window.addEventListener('keydown', e => {
  if (!MG.on) return;
  const k = { ArrowUp: 1, ArrowRight: 2, ArrowDown: 3, ArrowLeft: 4, ' ': 5, Spacebar: 5, Enter: 0 }[e.key];
  if (k !== undefined) { e.preventDefault(); mgPress(k); }
});

<script>
'use strict';
// ===== 啟動、主迴圈、輸入、版面 =====
let _lastT = 0;
function layoutGame(refit) {
  if (G.screen !== 'scr-game') return;
  const hud = $('#hud'); R.hudH = hud ? hud.offsetHeight : 44;
  const sh = $('#sheet'); R.botPad = sh && sh.classList.contains('on') ? sh.offsetHeight : 0;
  resizeScene(window.innerWidth, window.innerHeight, refit);
}
function frame(ts) {
  let dt = Math.min(0.1, (ts - (_lastT || ts)) / 1000); _lastT = ts;
  if (G.screen === 'scr-game' && G.day) {
    if (!G.paused && !G.day.ended) {
      let sim = dt * G.speed;
      while (sim > 0) { const st = Math.min(0.05, sim); updateDay(st); sim -= st; if (G.day.ended) break; }
      if (G.selT > 0) { G.selT -= dt; if (G.selT <= 0) G.selPool = null; }
    }
    if (R.panAnim) { const a = R.panAnim; a.t += dt; const k = Math.min(1, dt * 8); R.cam.x += (a.x - R.cam.x) * k; R.cam.y += (a.y - R.cam.y) * k; clampCam(); if (a.t > 0.8) R.panAnim = null; }
    if (G.day) { drawScene(G.paused ? 0 : dt); updatePanel(); }
  }
  mgTick(dt);
  requestAnimationFrame(frame);
}
// ---- 觸控／滑鼠：單指拖曳平移、雙指捏合縮放、滾輪縮放、點擊互動 ----
const PT = { map: new Map(), drag: false, pinch: null, start: null };
function onDown(e) {
  audioUnlock(); R.cv.setPointerCapture && R.cv.setPointerCapture(e.pointerId);
  PT.map.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (PT.map.size === 1) { PT.drag = false; PT.start = { x: e.clientX, y: e.clientY, cx: R.cam.x, cy: R.cam.y }; PT.pinch = null; }
  else if (PT.map.size === 2) { const [a, b] = [...PT.map.values()]; PT.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: R.cam.z }; PT.drag = true; }
}
function onMove(e) {
  if (!PT.map.has(e.pointerId)) return;
  PT.map.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (PT.pinch && PT.map.size >= 2) {
    const [a, b] = [...PT.map.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, PT.pinch.z * d / Math.max(1, PT.pinch.d));
  } else if (PT.start && PT.map.size === 1) {
    const dx = e.clientX - PT.start.x, dy = e.clientY - PT.start.y;
    if (!PT.drag && Math.hypot(dx, dy) > 8) PT.drag = true;
    if (PT.drag) { const z = zi(); R.cam.x = PT.start.cx - dx * R.dpr / z; R.cam.y = PT.start.cy - dy * R.dpr / z; clampCam(); }
  }
}
function onUp(e) {
  const had = PT.map.has(e.pointerId); PT.map.delete(e.pointerId);
  if (!had) return;

  else if (PT.map.size === 1) { const [p] = [...PT.map.values()]; PT.start = { x: p.x, y: p.y, cx: R.cam.x, cy: R.cam.y }; PT.pinch = null; }
}
function onWheel(e) { e.preventDefault(); zoomAt(e.clientX, e.clientY, zi() + (e.deltaY < 0 ? 1 : -1)); }
function sceneTap(cx, cy) {
  if (!G.day || G.paused || G.day.ended) return;
  const sh = hitTestScreen(cx, cy);
  if (sh) { sfx('tap'); panTo(sh.lx, sh.ly); return; }
  const [lx, ly] = screenToLogical(cx, cy);
  const h = hitTest(lx, ly);
  if (!h) { closeSheet(); return; }
  switch (h.act) {
    case 'checkin':
      if (G.day.lockerUse >= GAME.LOCKERS) { toast('置物櫃已滿！'); return; }
      if (G.day.queue[0] === h.c.id) checkIn(h.c); break;
    case 'order': serveOrder(h.c); break;
    case 'scrub': if (h.c.state === 'scrubWait') { sfx('tap'); closeSheet(); startScrub(h.c); } break;
    case 'bin': emptyBin(h.i); break;

    case 'fac': sfx('tap'); openSheet(h.id); break;
  }

}
function panTo(lx, ly) { R.panAnim = { x: lx - R.W / zi() / 2, y: ly - (R.H - (R.botPad || 0) * R.dpr) / zi() / 2, t: 0 }; }
async function boot() {
  loadSave();
  await loadGFX();
  prepUIImages();
  initRender($('#scene'));
  const cv = $('#scene');

  cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
  cv.addEventListener('wheel', onWheel, { passive: false });

  if (/debug/.test(location.hash)) window.__bh = { G, toScreen: logicalToScreen, centerCam, cam: () => ({ ...R.cam, zi: zi(), min: R.minZ, max: R.maxZ }), setSpeed: v => G.speed = v, spawn: () => spawnCustomer(), endNow: () => { G.day.t = GAME.DAY_SECONDS; }, startScrub, MG, mgPress, hitTest, R, emptyBin, valve, upgradeFac, facLv };
  $('#loading').remove();
  buildTitle();
  requestAnimationFrame(frame);
}
window.addEventListener('DOMContentLoaded', () => boot().catch(e => { const l = $('#loading'); if (l) l.textContent = '載入失敗：' + e.message; console.error(e); }));

</script>
